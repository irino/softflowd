[package]
name = "rsoftflowd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "rsoftflowd"
path = "src/bin/rsoftflowd.rs"

[[bin]]
name = "rsoftflowctl"
path = "src/bin/rsoftflowctl.rs"

[features]
default = []
ntopng = ["dep:zmq"]

[dependencies]
pcap = "2.0.0"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.29.0", features = ["socket", "signal", "user", "net", "fs", "process", "time"] }
byteorder = "1.5.0"
log = "0.4.22"
env_logger = "0.11.5"
libc = "0.2.155"
chrono = "0.4.38"
zmq = { version = "0.10", optional = true }
syslog = "6.1"

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_mangen = "0.2"
nix = { version = "0.29.0", features = ["time"] }
libc = "0.2.155"
