name: Build release packages

on:
  push:
    tags:
      - 'softflowd-*'

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev autoconf automake libtool
      - name: make dist
        run: |
          autoreconf -if
          ./configure
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: softflowd-*.tar.gz

  rpm:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      # Only the helper scripts are needed from the repository.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
      # Docker Hub first, the AWS ECR Public mirror as the fallback; see the
      # note in build.yml.
      - name: Pull the base image
        id: image
        run: sh .github/scripts/pull-image.sh fedora:latest
      - name: Build RPM
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "${{ steps.image.outputs.ref }}" sh .github/scripts/rpm-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: '*.rpm'

  release:
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm-packages
          path: rpm-packages
      - uses: softprops/action-gh-release@v2
        with:
          files: rpm-packages/*.rpm
