# The Gemini Issue Agent for the Rust version (rust/) of softflowd.
# Ported from https://github.com/irino/netsim (.github/workflows/gemini-issue-agent.yml).
# Differences from netsim: the Rust toolchain is the one of rust/rust-toolchain.toml,
# the checks run in rust/ without the secrets in their environment, the agent may
# change only files under rust/, and the commit message is the title of the pull
# request. See .github/GEMINI-ISSUE-AGENT.en.md.
name: Gemini Issue Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  coding-agent:
    if: >-
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ai-task' &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'ai-task') &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/retry'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post start status to Issue and log
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "[agent] Starting task for issue #${ISSUE_NUMBER}... / Issue #${ISSUE_NUMBER} のタスクを開始します..."
          {
            echo "### 🤖 Gemini Issue Agent"
            echo
            echo "**Status / 進捗状況:**"
            echo "- 🚀 Started processing issue #${ISSUE_NUMBER}..."
            echo "- 🚀 Issue #${ISSUE_NUMBER} の処理を開始しました..."
          } > "$RUNNER_TEMP/start-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/start-comment.md" || true

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-diagnostics-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/agent.log
            ${{ runner.temp }}/cargo-validation-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev
          version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal \
            --component rustfmt --component clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Gemini SDK
        run: |
          echo "[setup] Installing Google GenAI SDK... / Google GenAI SDK をインストール中..."
          python -m pip install --disable-pip-version-check "google-genai>=1.30,<2"

      - name: Implement issue with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CONFIG: .github/gemini-models.json
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MAX_AGENT_TURNS: "128"
        run: |
          echo "[agent] Running Gemini Issue Agent... / Gemini Issue Agent を実行中..."
          python .github/scripts/gemini_issue_agent.py \
            --report-output "$RUNNER_TEMP/agent-report.json" \
            --patch-output "$RUNNER_TEMP/agent.patch" 2>&1 | tee "$RUNNER_TEMP/agent.log"

      - name: Validate and request bounded repairs
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CONFIG: .github/gemini-models.json
          MAX_AGENT_TURNS: "16"
          MAX_REPAIR_ROUNDS: "3"
        run: |
          set -uo pipefail
          # The code of the agent runs in the checks (tests, build.rs), so the
          # checks get an environment without the secrets of this step.
          run_checks() {
            (
              unset GEMINI_API_KEY GH_TOKEN
              cd rust &&
              echo "==> 1. cargo fmt check" &&
              cargo fmt --check &&
              echo "==> 2. cargo clippy" &&
              cargo clippy --all-targets -- -D warnings &&
              echo "==> 3. cargo test" &&
              cargo test
            )
          }
          for round in 0 1 2 3; do
            echo "[validation] Starting validation round ${round}... / 検証ラウンド ${round} を開始します..."
            log="$RUNNER_TEMP/cargo-validation-${round}.log"
            {
              echo "### Validation round $round"
              run_checks
            } >"$log" 2>&1
            status=$?
            cat "$log"
            if [ "$status" -eq 0 ]; then
              echo "[validation] Validation passed successfully! / 検証に成功しました！"
              echo "passed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$round" -eq 3 ]; then
              echo "[validation] Validation failed after 3 repair attempts. / 3回の修復試行後も検証に失敗しました。" >&2
              exit "$status"
            fi
            echo "[validation] Requesting repair round $((round + 1))... / 修復ラウンド $((round + 1)) を要求します..."
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ **Validation round $((round + 1)) failed. Attempting automated repair...** / **検証ラウンド $((round + 1)) に失敗しました。自動修復を試みています...**" || true
            python .github/scripts/gemini_issue_agent.py \
              --feedback-file "$log" \
              --report-output "$RUNNER_TEMP/agent-report.json" \
              --patch-output "$RUNNER_TEMP/agent.patch"
          done

      - name: Generate final patch
        run: |
          echo "[patch] Generating final patch from working tree... / 作業ツリーから最終パッチを生成中..."
          echo "[patch] Current git status:"
          git status --porcelain --untracked-files=all
          git status --porcelain --untracked-files=all | while IFS= read -r line; do
            if [[ "$line" =~ ^\?\?\ (.*) ]]; then
              git add -N -- "${BASH_REMATCH[1]}"
            fi
          done
          git diff --binary HEAD > "$RUNNER_TEMP/agent.patch"
          if [ ! -s "$RUNNER_TEMP/agent.patch" ]; then
            echo "[patch] Error: No changes produced by the agent / エラー: エージェントによる変更が生成されませんでした" >&2
            echo "[patch] Detailed working tree status:"
            git status
            if [ -f "$RUNNER_TEMP/agent-report.json" ]; then
              echo "[patch] Agent report JSON contents:"
              cat "$RUNNER_TEMP/agent-report.json"
            else
              echo "[patch] No agent report JSON found."
            fi
            exit 1
          fi
          echo "[patch] Patch generated: $(wc -c < "$RUNNER_TEMP/agent.patch") bytes / パッチ生成完了: $(wc -c < "$RUNNER_TEMP/agent.patch") バイト"
          echo "[patch] Changed files summary:"
          git diff --name-status HEAD

      - name: Upload agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-artifact-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/agent.patch
            ${{ runner.temp }}/agent-report.json
          retention-days: 1
          if-no-files-found: error

      - name: Report failure to Issue and log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "[error] Execution or validation failed / 実行または検証に失敗しました" >&2
          {
            echo "### ❌ Gemini Issue Agent"
            echo
            echo "**Status / 状態:** Failed / 失敗"
            echo
            echo "The agent encountered an error during execution or validation. Please check the Actions workflow run logs for details."
            echo
            echo "エージェントの実行または検証中にエラーが発生しました。詳細は Actions のワークフロー実行ログを確認してください。"
          } > "$RUNNER_TEMP/failure-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/failure-comment.md" || true

  # This job applies the patch and publishes it. It never runs the code of the
  # agent. A pull request that is created with the default token does not start
  # the workflows of the repository (build.yml); to have them run, set the
  # secret AI_PR_TOKEN (a fine-grained token with Contents and Pull requests
  # write access to this repository).
  create-pr:
    needs: coding-agent
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.AI_PR_TOKEN || github.token }}

      - name: Download agent artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-artifact-${{ github.event.issue.number }}
          path: ${{ runner.temp }}

      - name: Validate and apply agent patch
        run: |
          echo "[pr] Validating patch safety... / パッチの安全性を検証中..."
          PATCH_FILE="${{ runner.temp }}/agent.patch"
          test -s "$PATCH_FILE"
          test "$(wc -c < "$PATCH_FILE")" -le 250000

          # Check patch integrity
          git apply --check --whitespace=nowarn "$PATCH_FILE"

          # Extract changed files and check for forbidden paths (.github, secrets, etc.)
          # Keep the list out of the workspace: "git add -A" below would commit it.
          CHANGED="$RUNNER_TEMP/changed-files.txt"
          git apply --numstat "$PATCH_FILE" | awk '{print $3}' > "$CHANGED"
          if grep -E '(^\.github/|^\.git/|(^|/)\.env|(^|/)secrets?([./]|$))' "$CHANGED"; then
            echo "[pr] Error: Forbidden file changes detected in patch! / エラー: 禁止されたファイルへの変更が検出されました！" >&2
            exit 1
          fi
          # The agent may change the Rust version only.
          if grep -Ev '^rust/' "$CHANGED"; then
            echo "[pr] Error: The patch changes files outside rust/! / エラー: rust/ の外のファイルが変更されています！" >&2
            exit 1
          fi
          if grep -E '^rust/(target/|rust-toolchain\.toml$)' "$CHANGED"; then
            echo "[pr] Error: The patch changes a file that the agent must not change! / エラー: 変更してはいけないファイルが含まれています！" >&2
            exit 1
          fi

          echo "[pr] Applying patch... / パッチを適用しています..."
          git apply --binary --whitespace=nowarn "$PATCH_FILE"
          git diff --check
          echo "[pr] Patch validated and applied successfully. / パッチの検証と適用に成功しました。"

      - name: Create branch and pull request (or update existing)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AI_PR_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          REPORT_FILE: ${{ runner.temp }}/agent-report.json
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}-gemini"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git diff --cached --quiet && {
            echo "[pr] No changes to publish / 公開する変更がありません" >&2
            exit 1
          }
          TITLE="$(jq -r '.pr_title // "Address the issue"' "$REPORT_FILE")"
          git commit -m "$TITLE" -m "Issue #${ISSUE_NUMBER}, implemented by the Gemini Issue Agent."
          echo "[pr] Pushing branch $BRANCH... / ブランチ $BRANCH をプッシュ中..."
          git push --force-with-lease origin "$BRANCH"

          SUMMARY_EN="$(jq -r '.summary_en // "Automated changes for the linked issue."' "$REPORT_FILE")"
          SUMMARY_JA="$(jq -r '.summary_ja // "関連Issueに対する自動変更です。"' "$REPORT_FILE")"
          {
            echo "## Summary"
            echo "$SUMMARY_EN"
            echo
            echo "$SUMMARY_JA"
            echo
            echo "## Validation"
            echo "Passed: cargo fmt --check, cargo clippy -D warnings, cargo test (in rust/)."
            echo
            echo "成功: cargo fmt --check、cargo clippy -D warnings、cargo test (rust/ で実行)。"
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$RUNNER_TEMP/pr-body.md"

          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
            PR_URL="$EXISTING_PR"
            echo "[pr] Updated existing PR: $PR_URL / 既存のPRを更新しました: $PR_URL"
          else
            PR_URL="$(gh pr create --base "$BASE_REF" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")"
            echo "[pr] Created PR: $PR_URL / PRを作成しました: $PR_URL"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.AI_PR_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          REPORT_FILE: ${{ runner.temp }}/agent-report.json
        run: |
          SUMMARY_EN="$(jq -r '.summary_en // "The agent completed the task."' "$REPORT_FILE")"
          SUMMARY_JA="$(jq -r '.summary_ja // "Agentがタスクを完了しました。"' "$REPORT_FILE")"
          {
            echo "## 🤖 Gemini Issue Agent"
            echo
            echo "**Status / 状態:** Completed successfully / 正常に完了しました"
            echo
            echo "### Summary / 概要"
            echo "$SUMMARY_EN"
            echo
            echo "$SUMMARY_JA"
            echo
            echo "### Pull Request / プルリクエスト"
            echo "$PR_URL"
            echo
            echo "_Automated changes are not merged automatically. / 自動生成された変更は自動ではマージされません。_"
          } > "$RUNNER_TEMP/issue-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md" || true
          echo "[pr] Posted completion comment to issue #${ISSUE_NUMBER} / Issue #${ISSUE_NUMBER} に完了コメントを投稿しました"
