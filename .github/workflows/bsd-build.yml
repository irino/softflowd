# .github/workflows/bsd-build.yml
name: BSD build test
on: [push, pull_request]
jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y libpcap autoconf automake libtool
          run: |
            autoreconf -if
            ./configure
            make

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -m)/$(uname -r|cut -d_ -f1)/All/"
            pkg_add libpcap autoconf automake libtool
          run: |
            autoreconf -if
            ./configure
            make

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add autoconf-2.69p3 automake-1.16.5p0
          run: |
            export AUTOCONF_VERSION=2.69
            export AUTOMAKE_VERSION=1.16
            autoreconf -if
            ./configure
            make
