# .github/workflows/bsd-build.yml
name: build test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
        # "without": libbsd is not installed, so configure falls back to the
        # files in compat/ where the C library lacks a function.
        libbsd: [without]
        include:
          - {image: "ubuntu:22.04", libbsd: with}
          - {image: "ubuntu:24.04", libbsd: with}
          - {image: "debian:12", libbsd: with}
    container:
      # The Docker official images from the AWS ECR Public mirror: pulling
      # them from Docker Hub fails once the shared runner IPs hit its
      # unauthenticated pull rate limit.
      image: public.ecr.aws/docker/library/${{ matrix.image }}
    steps:
      - name: Install git (needed by actions/checkout on minimal images)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential libpcap-dev autoconf automake libtool pkg-config

      - name: Install libbsd
        if: matrix.libbsd == 'with'
        run: apt-get install -y --no-install-recommends libbsd-dev

      # Every --enable-compat-export variant is built in the same job (out of
      # tree) instead of one job each, so an image is pulled once, not three
      # times.  All variants are tried even if one of them fails.
      - name: Build with warnings
        env:
          LIBBSD_ARG: ${{ matrix.libbsd == 'with' && '--with-libbsd' || '' }}
        run: |
          autoreconf -if
          fail=0
          for ce in default static static-separate; do
            echo "::group::compat-export=$ce"
            args=""
            [ "$ce" = default ] || args="--enable-compat-export=$ce"
            mkdir "build-$ce"
            (cd "build-$ce" && ../configure --enable-gcc-warnings $args $LIBBSD_ARG && make) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # Builds compile every --enable-compat-export variant above, but
  # never actually run the resulting binary -- which is exactly how a
  # NULL-pointer dereference in the default encoder-based exporter's per-flow record
  # path went unnoticed (it happened to not crash at -O2 on the one
  # version tried by hand, purely by luck of stack layout). This job
  # replays a small generated pcap through every NetFlow/IPFIX version,
  # under ASan+UBSan so a bug like that aborts deterministically
  # instead of silently "working" by chance.
  runtime-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compat_export: [default, static, static-separate]
        libbsd: [without, with]
    env:
      # Pre-existing, unrelated issues must not fail this job: alignment
      # warnings from casting raw packet bytes to struct ip/icmp/etc. in
      # softflowd.c's parser (UBSan, non-fatal here), and a few small
      # long-lived allocations (freelist growth, getaddrinfo) that
      # LeakSanitizer would otherwise flag (detect_leaks=0) -- fixing
      # those is a separate concern. A real memory-safety bug (SEGV,
      # heap corruption, NULL deref, use-after-free) still aborts the
      # process with a nonzero exit code, which the run step below checks.
      UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpcap-dev autoconf automake libtool pkg-config python3
          if [ "${{ matrix.libbsd }}" = with ]; then
            sudo apt-get install -y --no-install-recommends libbsd-dev
          fi

      - name: Generate smoke-test pcap
        run: python3 tools/gen_ci_smoke_pcap.py ci_smoke.pcap

      - name: Build with AddressSanitizer/UndefinedBehaviorSanitizer
        run: |
          autoreconf -if
          ./configure ${{ matrix.compat_export != 'default' && format('--enable-compat-export={0}', matrix.compat_export) || '' }} \
            --${{ matrix.libbsd }}-libbsd \
            CFLAGS="-g -O0 -fsanitize=address,undefined -fno-omit-frame-pointer"
          make

      - name: Run against smoke-test pcap for every export version
        run: |
          set -e
          for v in 1 5 9 10; do
            echo "== NetFlow/IPFIX version $v (compat-export=${{ matrix.compat_export }}, ${{ matrix.libbsd }} libbsd) =="
            ./softflowd -r ci_smoke.pcap -n 127.0.0.1:2055 -v "$v"
          done
          echo "== bidirectional IPFIX (-b, version 10) =="
          ./softflowd -r ci_smoke.pcap -n 127.0.0.1:2055 -v 10 -b

  # Replays sample pcaps through softflowd 1.1.1 (the stable reference) and
  # through this tree, and diffs the NetFlow v1/v5/v9 and IPFIX flows they
  # export, so that an unintended change in the exported flow data fails the
  # build (tools/softflowd_test_collector.py compat).  The flows are decoded
  # either by the built-in Python collector or by nfcapd/nfdump.  The pcaps
  # are generated, so the job does not depend on downloading them.
  compat-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collector: [python, nfdump]
    steps:
      - uses: actions/checkout@v4
        with:
          # The stable reference is built from an old commit.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpcap-dev autoconf automake libtool pkg-config python3
          if [ "${{ matrix.collector }}" = nfdump ]; then
            sudo apt-get install -y --no-install-recommends nfdump
          fi

      - name: Generate sample pcaps
        run: |
          # 20 flows fit in one NetFlow v1 datagram (24 records at most).
          # softflowd 1.1.1 puts 29 records into a v1 datagram, which
          # nfdump drops, so more flows would fail the nfdump job on the
          # stable reference.
          mkdir pcaps
          python3 tools/gen_ci_smoke_pcap.py -n 20 pcaps/http.cap
          python3 tools/gen_ci_smoke_pcap.py -6 -n 20 pcaps/v6-http.cap

      - name: Compatibility test (stable 1.1.1 vs this tree)
        run: |
          python3 tools/softflowd_test_collector.py compat --skip-cpp --skip-rust \
            --collector ${{ matrix.collector }} --pcap-dir pcaps

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y libpcap autoconf automake libtool
          run: |
            autoreconf -if
            ./configure
            make

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -m)/$(uname -r|cut -d_ -f1)/All/"
            pkg_add libpcap autoconf automake libtool
          run: |
            autoreconf -if
            ./configure
            make

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add autoconf-2.69p3 automake-1.16.5p0
          run: |
            export AUTOCONF_VERSION=2.69
            export AUTOMAKE_VERSION=1.16
            autoreconf -if
            ./configure
            make
